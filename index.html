<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14423f">
  <title>Memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" data-mode="solo">
    <div class="panel">
      <header class="top">
        <div class="brand">
          <h1>Memory</h1>
          <p class="tagline">Finde alle Paare.</p>
        </div>
        <dl class="stats">
          <div class="stat"><dt>Züge</dt><dd id="moves">0</dd></div>
          <div class="stat"><dt>Zeit</dt><dd id="time">0:00</dd></div>
          <div class="stat"><dt>Paare</dt><dd id="pairs">0/8</dd></div>
          <div class="stat solo-only"><dt>Rekord</dt><dd id="best">–</dd></div>
        </dl>
      </header>

      <div class="progress" id="progress" role="progressbar" aria-label="Gefundene Paare" aria-valuemin="0" aria-valuenow="0" aria-valuemax="8">
        <span></span>
      </div>

      <ul class="scoreboard" id="scoreboard" aria-label="Punktestand" hidden></ul>

      <div class="controls">
        <div class="field">
          <span class="field-label" id="size-label">Schwierigkeit</span>
          <div class="seg" id="sizes" role="group" aria-labelledby="size-label" style="--n:3">
            <span class="thumb" aria-hidden="true"></span>
            <button type="button" class="seg-btn" data-size="4x3" aria-pressed="false">Leicht</button>
            <button type="button" class="seg-btn" data-size="4x4" aria-pressed="true">Mittel</button>
            <button type="button" class="seg-btn" data-size="6x6" aria-pressed="false">Schwer</button>
          </div>
        </div>

        <div class="field">
          <span class="field-label" id="players-label">Spieler</span>
          <div class="seg" id="players" role="group" aria-labelledby="players-label" style="--n:4">
            <span class="thumb" aria-hidden="true"></span>
            <button type="button" class="seg-btn" data-players="1" aria-pressed="true">1</button>
            <button type="button" class="seg-btn" data-players="2" aria-pressed="false">2</button>
            <button type="button" class="seg-btn" data-players="3" aria-pressed="false">3</button>
            <button type="button" class="seg-btn" data-players="4" aria-pressed="false">4</button>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="icon-btn multi-only" id="names-btn" aria-label="Namen ändern" title="Namen ändern">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 20h4L19 9l-4-4L4 16v4z"/>
              <path d="M13.5 6.5l4 4"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="sound" aria-pressed="true" aria-label="Ton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
              <path class="waves" d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>
              <path class="slash" d="M17 9.5l5 5M22 9.5l-5 5"/>
            </svg>
          </button>
          <button type="button" class="btn" id="restart" aria-label="Neu mischen">
            <span class="btn-text">Neu mischen</span>
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
              <path d="M20 4v5h-5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="stage">
      <section id="board" class="board" aria-label="Spielfeld"></section>
    </div>
    <p id="status" class="sr-only" aria-live="polite"></p>
  </main>

  <dialog id="win" class="win" aria-labelledby="win-title">
    <canvas id="confetti" aria-hidden="true"></canvas>
    <form method="dialog" class="win-panel">
      <div class="stars" id="stars" aria-hidden="true"></div>
      <h2 id="win-title">Geschafft!</h2>
      <p id="win-text"></p>
      <ul class="scores" id="win-scores" hidden></ul>
      <p id="win-record" class="badge" hidden>Neuer Rekord</p>
      <button class="btn" autofocus><span class="btn-text">Nochmal spielen</span></button>
    </form>
  </dialog>

  <dialog id="names" class="modal" aria-labelledby="names-title">
    <form method="dialog" id="names-form" class="modal-panel">
      <h2 id="names-title">Spielernamen</h2>
      <p class="hint">Optional. Leere Felder behalten den Standardnamen.</p>
      <div id="name-fields"></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="names-cancel">Abbrechen</button>
        <button type="submit" class="btn" value="save">Speichern</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
